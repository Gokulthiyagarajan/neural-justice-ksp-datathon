name: Neural Justice Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Catalyst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Deploy to Catalyst (dev)
        run: catalyst deploy --token "$CATALYST_TOKEN" -p 52367000000021001 --org 60077006311 --dc in -ni
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}

      - name: Smoke test deployed app
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://neural-justice-60077006311.development.catalystserverless.in/app/index.html)
          echo "APP HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Deployed app returned $status, not 200. Deployment failed or not live."
            exit 1
          fi